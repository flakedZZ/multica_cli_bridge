name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-bridge.txt
      - run: python scripts/audit_public.py
      # Host/SDK tests explicitly skip without MaiBot; see README for full suite.
      - run: python -m unittest discover -s tests -v
